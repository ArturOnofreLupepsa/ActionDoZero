
name: Gerar Changelog

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  changelog:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar o repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gerar CHANGELOG.md
        run: |
          {
            echo "# Changelog"
            echo ""
            echo "Registro das ultimas alteracoes do projeto."
            echo ""
            echo "## Commits recentes"
            echo ""

            git log -10 --no-merges --date=short \
              --pretty=format:'- %h - %s (%ad)' \
              -- . ':(exclude)CHANGELOG.md' || true

            echo ""
          } > CHANGELOG.md

      - name: Salvar Changelog no GitHub
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add CHANGELOG.md

          if git diff --cached --quiet; then
            echo "Nenhuma alteracao no Changelog."
          else
            git commit -m "docs(changelog): atualiza changelog [skip ci]"
            git push
          fi
